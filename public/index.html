<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RailGuard AI | Dispatch Comparison</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #07131d; color: #eaf2f7; }
      body { max-width: 1120px; margin: auto; padding: 42px 24px; }
      header { display:flex; justify-content:space-between; align-items:start; gap:20px; margin-bottom:28px; }
      h1 { margin:0; font-size:clamp(2rem,4vw,3.4rem); } h2 { margin:0 0 14px; } p { color:#a9bdca; }
      .tag { background:#123344; color:#71e4d5; border:1px solid #28606b; border-radius:999px; padding:7px 11px; white-space:nowrap; }
      .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:24px 0; }
      .metric, .panel { background:#0d202d; border:1px solid #1d3d4c; border-radius:16px; padding:22px; }
      .metric span { color:#9bb2c1; font-size:.9rem; } .metric strong { display:block; margin-top:8px; font-size:2.45rem; }
      .legacy strong { color:#ff9d80; } .saved strong, .efficiency strong { color:#75e2b3; }
      .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; } .panel h2 { font-size:1.15rem; }
      .item { padding:14px 0; border-top:1px solid #1d3d4c; } .item:first-of-type { border-top:0; }
      .item b { display:block; color:#fff; } .item small { color:#9bb2c1; } .error { color:#ff9d80; }
      @media (max-width:720px) { .metrics, .grid { grid-template-columns:1fr; } header { flex-direction:column; } }
    </style>
  </head>
  <body>
    <header><div><p>RAILGUARD AI · 100 KM SECTOR</p><h1>Legacy vs AI Dispatch</h1></div><div id="status" class="tag">Loading live data…</div></header>
    <section class="metrics">
      <article class="metric legacy"><span>Legacy added delay</span><strong id="legacy">—</strong></article>
      <article class="metric saved"><span>AI delay saved</span><strong id="saved">—</strong></article>
      <article class="metric efficiency"><span>Throughput improvement</span><strong id="efficiency">—</strong></article>
    </section>
    <section class="grid">
      <article class="panel"><h2>Legacy manual dispatch</h2><p id="legacyDescription"></p><div id="legacyActions"></div></article>
      <article class="panel"><h2>AI-assisted dispatch</h2><p id="aiDescription"></p><div id="aiSteps"></div></article>
    </section>
    <script>
      const item = (title, text) => `<div class="item"><b>${title}</b><small>${text}</small></div>`;
      async function load() {
        try {
          const data = await fetch('/api/dispatch-comparison').then(r => r.json());
          const legacy = data.legacyDispatchOutcome;
          const ai = data.aiOptimizedDispatchOutcome;
          document.querySelector('#legacy').textContent = `${legacy.totalCumulativeDelayAddedMin} min`;
          document.querySelector('#saved').textContent = `${ai.totalDelaySavedMin} min`;
          document.querySelector('#efficiency').textContent = `${ai.throughputEfficiencyGainPct}%`;
          document.querySelector('#legacyDescription').textContent = legacy.strategyDescription;
          document.querySelector('#aiDescription').textContent = ai.strategyDescription;
          document.querySelector('#legacyActions').innerHTML = legacy.trainActions.map(x => item(`${x.action} · Train ${x.trainId}`, `+${x.additionalDelayMin} min — ${x.reasoning}`)).join('');
          document.querySelector('#aiSteps').innerHTML = ai.dispatchSteps.map(x => item(`${x.command} · Train ${x.targetTrainId}`, `T+${x.timeOffsetMin} min · ${x.targetLineOrLoop} · ${x.targetSpeedKmh} km/h`)).join('');
          document.querySelector('#status').textContent = '● LIVE SECTOR DATA';
        } catch (error) { document.querySelector('#status').textContent = 'Unable to load'; document.querySelector('#status').classList.add('error'); }
      }
      load();
    </script>
  </body>
</html>
